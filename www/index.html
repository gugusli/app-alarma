<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alarma</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; padding: 24px;
  }
  .card { width: 100%; max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #8b949e; font-size: 14px; margin: 0 0 18px; line-height: 1.4; }
  input, button {
    width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; border: 1px solid #30363d;
  }
  input { background: #161b22; color: #e6edf3; margin-bottom: 12px; }
  button { background: #238636; color: #fff; border: 0; font-weight: 600; }
  #forzar { display: none; margin-top: 10px; background: #30363d; }
  #estado { margin-top: 14px; font-size: 14px; min-height: 20px; line-height: 1.4; }
  .err { color: #f85149; }
  .ok { color: #3fb950; }
</style>
</head>
<body>
<div class="card">
  <h1>Sistema de Alarma</h1>
  <p>Ingresá la dirección del servidor donde corre el dashboard.</p>
  <input id="url" type="url" inputmode="url" placeholder="https://algo.trycloudflare.com" autocomplete="off">
  <button id="btn">Conectar</button>
  <button id="forzar">Abrir igual</button>
  <div id="estado"></div>
</div>
<script>
  const KEY = "alarma_server_url";
  const input = document.getElementById("url");
  const estado = document.getElementById("estado");
  const btnForzar = document.getElementById("forzar");

  function normalizar(v) {
    v = (v || "").trim().replace(/\/+$/, "");
    if (!v) return "";
    if (!/^https?:\/\//i.test(v)) v = "http://" + v;
    return v;
  }

  function abrir(url) {
    localStorage.setItem(KEY, url);
    location.replace(url + "/");
  }

  async function conectar(url) {
    estado.className = "";
    estado.textContent = "Conectando... (puede tardar hasta 25 segundos)";
    btnForzar.style.display = "none";
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 25000);
    try {
      await fetch(url + "/", { mode: "no-cors", cache: "no-store", signal: ctl.signal });
      clearTimeout(t);
      estado.className = "ok";
      estado.textContent = "Conectado";
      abrir(url);
    } catch (e) {
      clearTimeout(t);
      estado.className = "err";
      estado.textContent = "No se pudo comprobar la conexión (" + e.name + ": " + e.message +
        "). Si la URL carga en Chrome, probá con \"Abrir igual\".";
      btnForzar.style.display = "block";
    }
  }

  document.getElementById("btn").addEventListener("click", () => {
    const url = normalizar(input.value);
    if (url) conectar(url);
  });

  btnForzar.addEventListener("click", () => {
    const url = normalizar(input.value);
    if (url) abrir(url);
  });

  const guardada = localStorage.getItem(KEY);
  if (guardada) { input.value = guardada; conectar(guardada); }
</script>
</body>
</html>
